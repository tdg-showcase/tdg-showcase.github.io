<style>
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#1F4A87;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;width:100%;max-width:380px;padding:34px 32px 30px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#326DC2;margin-bottom:8px}
h1{font-size:22px;font-weight:800;color:#1F4A87;margin:0 0 6px;letter-spacing:-.01em}
p.sub{font-size:14px;color:#516468;margin:0 0 22px;line-height:1.4}
label{display:block;font-size:12px;font-weight:600;color:#16302f;margin-bottom:6px}
input{width:100%;font-size:15px;padding:12px 13px;border:1px solid #cfd9da;background:#fbfdfd;outline:none}
input:focus{border-color:#326DC2}
button{width:100%;margin-top:14px;font-size:15px;font-weight:600;color:#fff;background:#1e5fd6;border:0;padding:13px;cursor:pointer}
button:hover{background:#1a53bd}
.err{min-height:18px;margin-top:12px;font-size:13px;color:#c0392b}
</style></head><body>
<form class="card" onsubmit="unlock();return false;">
  <div class="eyebrow">TDG Showcase</div>
  <h1>Design Previews</h1>
  <p class="sub">These samples are password-protected. Enter the password to view it.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="off" autofocus>
  <button type="submit">View samples</button>
  <div class="err" id="err"></div>
</form>

function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function unlock(){
  const pw=document.getElementById('pw').value, err=document.getElementById('err');
  err.textContent='Unlocking…';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(__TDG_GATE.salt),iterations:__TDG_GATE.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(__TDG_GATE.iv)},key,b64(__TDG_GATE.ct));
    const html=new TextDecoder().decode(buf);
    try{sessionStorage.setItem('acme_pw',pw);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){ err.textContent='Incorrect password. Please try again.'; }
}
(function(){try{var p=sessionStorage.getItem('acme_pw');if(p){document.getElementById('pw').value=p;unlock();}}catch(e){}})();
