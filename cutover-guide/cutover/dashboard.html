<style>
*{box-sizing:border-box} html,body{margin:0;min-height:100%}
body{font-family:"Arimo",Arial,Helvetica,sans-serif;background:#00112D;background-image:linear-gradient(112deg,#00112D 0%,#00235A 44%,#0257A8 78%,#0385FE 100%);background-attachment:fixed;display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px 16px}
.card{background:#FFFFFF;width:100%;max-width:400px;padding:36px 36px 30px;border-radius:8px;box-shadow:0 18px 50px rgba(0,17,45,.35)}
.logo{display:block;width:180px;height:auto;aspect-ratio:480/231;margin:0 0 26px}
h1{font-size:24px;font-weight:700;color:#00235A;margin:0 0 8px;letter-spacing:-.01em;line-height:1.2}
p.sub{font-size:15px;color:#4D6076;margin:0 0 24px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;color:#00235A;margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;color:#00112D;padding:12px 14px;border:1px solid #D8E3F0;border-radius:6px;background:#F4F6FA;outline:none}
input:focus{border-color:#0257A8;background:#FFFFFF;box-shadow:0 0 0 3px #E3F2FF}
button{width:100%;margin-top:14px;font:inherit;font-size:16px;font-weight:700;color:#FFFFFF;background:#0257A8;border:0;border-radius:6px;padding:14px;min-height:48px;cursor:pointer}
button:hover{background:#00235A}
button:focus-visible{outline:3px solid #AFDCFF;outline-offset:2px}
.err{min-height:20px;margin-top:12px;font-size:14px;color:#C8313A}
.foot{margin-top:18px;padding-top:16px;border-top:1px solid #D8E3F0;font-size:13px;color:#4D6076}
@media (max-width:420px){.card{padding:28px 22px 24px}.logo{width:160px;margin-bottom:22px}h1{font-size:22px}}
</style></head><body>

function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function unlock(){
  const pw=document.getElementById('pw').value, err=document.getElementById('err');
  err.textContent='Unlocking…';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(__TDG_GATE.salt),iterations:__TDG_GATE.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(__TDG_GATE.iv)},key,b64(__TDG_GATE.ct));
    const html=new TextDecoder().decode(buf);
    try{sessionStorage.setItem('acme_pw',pw);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){ err.textContent='Incorrect password. Please try again.'; }
}
(function(){try{var p=sessionStorage.getItem('acme_pw');if(p){document.getElementById('pw').value=p;unlock();}}catch(e){}})();
